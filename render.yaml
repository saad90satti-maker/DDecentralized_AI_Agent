services:
  - type: web_service
    name: decentralized-ai-agent
    env: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: >
      uvicorn manager:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GMAIL_USER
        fromSecret: GMAIL_USER
      - key: GMAIL_PASS
        fromSecret: GMAIL_PASS
      - key: HUGGINGFACE_TOKEN
        fromSecret: HUGGINGFACE_TOKEN
      - key: GROQ_API_KEY
        fromSecret: GROQ_API_KEY
      - key: GITHUB_TOKEN
        fromSecret: GITHUB_TOKEN
      - key: CLOUDFLARE_TOKEN
        fromSecret: CLOUDFLARE_TOKEN
      - key: DISCORD_TOKEN
        fromSecret: DISCORD_TOKEN
      - key: DISCORD_CHANNEL_ID
        fromSecret: DISCORD_CHANNEL_ID
      - key: PUBLIC_WEBHOOK_URL
        fromSecret: PUBLIC_WEBHOOK_URL
      - key: HERMES_URL
        value: http://localhost:11434
      - key: HERMES_MODEL
        value: llama3.2:1b
      - key: SWARM_SECRET
        fromSecret: SWARM_SECRET
      - key: NODE_ID
        value: render-ghost-node
      - key: DHT_ENABLED
        value: "true"
      - key: DHT_PORT
        value: "8468"
      - key: TRANSMISSION_MODE
        value: downlink
      - key: SWARM_HOST
        value: "0.0.0.0"
      - key: ENABLE_DHT
        value: "1"

  - type: cron_job
    name: ghostsignal-passive-listener
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt numpy reedsolo kademlia
    startCommand: python -c "
import asyncio, os, sys
os.chdir('/opt/render/project/src')
sys.path.insert(0, '.')
os.environ['SWARM_SECRET'] = os.getenv('SWARM_SECRET', 'default')
import stealth_beyond_sat
asyncio.run(stealth_beyond_sat.start_passive_listener(force_active=True))
"
    envVars:
      - key: SWARM_SECRET
        fromSecret: SWARM_SECRET
      - key: NODE_ID
        value: render-ghost-signal
      - key: TRANSMISSION_MODE
        value: downlink
