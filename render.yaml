services:
  - type: web_service
    name: decentralized-ai-agent
    env: python
    plan: starter
    region: oregon
    buildCommand: |
      pip install -r requirements-render.txt
      playwright install chromium --with-deps 2>/dev/null || true
    startCommand: uvicorn manager:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 20
    healthCheckPath: /api/health
    envVars:
      # LLM
      - key: GEMINI_API_KEY
        fromSecret: GEMINI_API_KEY
      - key: GEMINI_API_MODEL
        value: models/gemini-2.5-flash
      - key: GROQ_API_KEY
        fromSecret: GROQ_API_KEY
      # Google
      - key: GMAIL_USER
        fromSecret: GMAIL_USER
      - key: GMAIL_PASS
        fromSecret: GMAIL_PASS
      # HuggingFace
      - key: HUGGINGFACE_TOKEN
        fromSecret: HUGGINGFACE_TOKEN
      - key: HF_API_TOKEN
        fromSecret: HUGGINGFACE_TOKEN
      # GitHub
      - key: GITHUB_TOKEN
        fromSecret: GITHUB_TOKEN
      # Cloudflare
      - key: CLOUDFLARE_TOKEN
        fromSecret: CLOUDFLARE_TOKEN
      # Discord
      - key: DISCORD_TOKEN
        fromSecret: DISCORD_TOKEN
      - key: DISCORD_CHANNEL_ID
        fromSecret: DISCORD_CHANNEL_ID
      # Social
      - key: X_API_KEY
        fromSecret: X_API_KEY
      - key: X_API_KEY_SECRET
        fromSecret: X_API_KEY_SECRET
      - key: X_ACCESS_TOKEN
        fromSecret: X_ACCESS_TOKEN
      - key: X_ACCESS_TOKEN_SECRET
        fromSecret: X_ACCESS_TOKEN_SECRET
      - key: TELEGRAM_BOT_TOKEN
        fromSecret: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_CHAT_ID
        fromSecret: TELEGRAM_CHAT_ID
      # Swarm
      - key: SWARM_SECRET
        fromSecret: SWARM_SECRET
      - key: NODE_ID
        value: render-ghost-node-1
      - key: DHT_ENABLED
        value: "false"
      - key: TRANSMISSION_MODE
        value: downlink
      - key: SWARM_HOST
        value: "0.0.0.0"
      # Local (not used on Render but required for startup)
      - key: HERMES_URL
        value: http://localhost:11434
      - key: HERMES_MODEL
        value: llama3.2:1b
      # Browser
      - key: HEADLESS_BROWSER
        value: "true"
      # Logging
      - key: LOG_LEVEL
        value: INFO
