[pytest]
# =============================================================================
# Ghost Engine — Pytest Configuration
# =============================================================================

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio support (auto mode)
asyncio_mode = auto

# Timeout (per-test, in seconds)
timeout = 120
timeout_method = thread

# Test output
verbosity = 2
console_output_style = progress
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)s] %(message)s

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring external services (IPFS, Redis, Ollama)
    unit: quick unit tests (default selection)
    security: security-related tests
    circuit_breaker: circuit breaker / failover tests
    connectivity: network connectivity tests
    p2p: peer-to-peer / swarm tests
    persistence: data persistence tests

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning
    ignore:coroutine '.*' was never awaited:RuntimeWarning

# Required pytest plugins
required_plugins =
    pytest-asyncio
    pytest-cov
    pytest-timeout

# Xfail strict mode: strict=True means the test is expected to fail
xfail_strict = false
